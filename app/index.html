<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jellin | Loyalty That Sticks</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="../assets/logos/icon/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/logos/icon/mobile/jellin-j-gradient.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/logos/icon/mobile/jellin-j-gradient.png">
